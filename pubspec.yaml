name: gestion_argent
description: "Application mobile de gestion d'argent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: any
  path: any
  path_provider: any
  provider: any
  intl: any
  fl_chart: any
  local_auth: any
  flutter_secure_storage: any
  crypto: any
  share_plus: any
  file_picker: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces_72pt-Regular.ttf
        - asset: assets/fonts/Fraunces_72pt-SemiBold.ttf
          weight: 600
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
        - asset: assets/fonts/DMSans_18pt-Bold.ttf
          weight: 700